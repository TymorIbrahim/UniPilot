# UniPilot AI -- demo stack.
#
# This is the kiosk-mode file: it is what the course gallery builds and runs,
# and it is deliberately the only compose file at the repo root. It follows
# the gallery's compose contract, which means it looks different from how the
# team actually develops:
#
#   * no volumes of any kind, named or bind -- every container starts from the
#     same seed state and forgets everything when it stops
#   * no `env_file` -- a fresh clone has no `.env`, so every value a service
#     needs is literal and right here
#   * exactly one published port (web), with everything else reachable only on
#     the internal network
#   * an explicit `mem_limit`/`cpus` on every service
#
# The values below are demo credentials for a throwaway database that holds no
# real data and is destroyed on every restart. They are not secrets and are not
# used anywhere else.
#
# For local development -- real catalog data mounted from disk, the offline
# data-engineering CLI, Outlook integration, `.env`-driven configuration --
# use `docker compose -f docker-compose.dev.yml up` instead.

services:
  # The only visitor-facing service. nginx serves the built SPA and proxies
  # /api to the api container, so the whole app is reachable through this one
  # port. Its upstream is resolved per-request (see services/web/nginx.conf),
  # so it starts and serves the UI whether or not api is up yet.
  web:
    build:
      context: ./services/web
      args:
        VITE_API_URL: /api
    ports:
      - "8080:8080"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/share/nginx/html/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    networks:
      - unipilot-internal

  api:
    build:
      context: ./services/api
    environment:
      API_PORT: 8000
      # `development` does exactly two things here: it turns on the catalog
      # seed below, and it leaves /docs reachable so a visitor can read the
      # API surface. Nothing else in the codebase branches on it.
      ENVIRONMENT: development
      AUTO_SEED_CATALOG: "true"
      # Seed the real DDS catalog -- the three DDS tracks with their actual
      # credit buckets and course pools, and the 236 courses they name -- rather
      # than the small fixture CI and the E2E suite assert against.
      SEED_DEMO_CATALOG: "true"
      MONGO_URI: mongodb://unipilot:unipilot_demo_password@mongo:27017/unipilot_demo?authSource=admin
      REDIS_URL: redis://:unipilot_demo_redis_password@redis:6379
      JWT_SECRET: unipilot_demo_jwt_secret_not_used_anywhere_else
      JWT_EXPIRES_IN: 1h
      BCRYPT_SALT_ROUNDS: 12
      AUTH_RATE_LIMIT_WINDOW_MS: 60000
      AUTH_RATE_LIMIT_MAX: 30
      AI_RATE_LIMIT_WINDOW_MS: 60000
      AI_RATE_LIMIT_MAX: 10
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      WEB_APP_URL: http://localhost:8080
      INTERNAL_SERVICE_TOKEN: unipilot_demo_internal_service_token_32ch
      TRANSCRIPT_PARSER_URL: http://transcript-parser:8010
      AI_SERVICE_URL: http://ai:3001
      # Google OAuth is deliberately left unconfigured: the e2e login stub is
      # only reachable when OAuth is enabled, so leaving these unset keeps it
      # off. Visitors register with email + password instead.
    depends_on:
      - mongo
      - redis
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    networks:
      - unipilot-internal

  ai:
    build:
      context: ./services/ai
    environment:
      ENVIRONMENT: development
      AI_SERVICE_PORT: 3001
      INTERNAL_SERVICE_TOKEN: unipilot_demo_internal_service_token_32ch
      MONGO_URI: mongodb://unipilot:unipilot_demo_password@mongo:27017/unipilot_demo?authSource=admin
      API_SERVICE_URL: http://api:8000
      # No model credentials in a public demo, so the advisor answers from the
      # deterministic grounded-facts path only and skips the LLM phrasing step.
      EMBEDDING_ENABLED: "false"
      EMBEDDING_INDEX_ENABLED: "false"
    depends_on:
      - mongo
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3001/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    networks:
      - unipilot-internal

  transcript-parser:
    build:
      context: ./services/transcript-parser
    environment:
      ENVIRONMENT: development
      TRANSCRIPT_PARSER_PORT: 8010
      INTERNAL_SERVICE_TOKEN: unipilot_demo_internal_service_token_32ch
      MAX_UPLOAD_BYTES: 5242880
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8010/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.5
    networks:
      - unipilot-internal

  # No volume: the database lives in the container's own writable layer and is
  # discarded with it, which is the point -- every visitor gets the same clean
  # catalog the api seeds on startup.
  mongo:
    image: mongo:7.0.15
    environment:
      MONGO_INITDB_ROOT_USERNAME: unipilot
      MONGO_INITDB_ROOT_PASSWORD: unipilot_demo_password
      MONGO_INITDB_DATABASE: unipilot_demo
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    networks:
      - unipilot-internal

  redis:
    image: redis:7.4.0-alpine
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--requirepass",
        "unipilot_demo_redis_password",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "unipilot_demo_redis_password", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    networks:
      - unipilot-internal

networks:
  unipilot-internal:
    driver: bridge
